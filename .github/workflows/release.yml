name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        default: 'v-dev'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Generate Mocks
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generate Database Migrations Schema
        run: flutter pub run drift_dev schema generate drift_schemas/ test/generated_migrations/

      - name: Configure Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Falta KEYSTORE_BASE64"; exit 1; }
          python3 -c "import os, base64; s = os.environ['KEYSTORE_BASE64']; s = ''.join(s.split()); m = len(s) % 4; s += '=' * (4 - m) if m else ''; open('android/my-release-key.jks', 'wb').write(base64.b64decode(s))"
          test -s android/my-release-key.jks

      - name: Build Release APKs
        env:
          KEYSTORE_FILE: "../my-release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Falta secreto de firma: $name"; exit 1; }
          done
          test -s android/my-release-key.jks
          flutter build apk --release --target-platform=android-arm,android-arm64
          flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64
          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}
          apksigner=$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          aapt=$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -x "$apksigner" && test -x "$aapt"
          expected_cert=$(keytool -exportcert -keystore android/my-release-key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | openssl dgst -sha256 | sed 's/.*= //' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          for apk in $(find build/app/outputs -type f -name '*release.apk'); do
            actual_cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
            test "$actual_cert" = "$expected_cert"
            badging=$($aapt dump badging "$apk")
            printf '%s\n' "$badging" | grep -F "package: name='com.clicktv.launcher'"
            version_code=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")
            test "$version_code" = 8114
          done
          find build/app/outputs -type f -name '*release.apk' -exec sha256sum {} \;

      - name: Preparar APK con nombres fijos
        run: |
          set -euo pipefail
          mkdir -p release-assets
          universal=$(find build/app/outputs/flutter-apk build/app/outputs/apk/release -maxdepth 1 -type f -name '*release.apk' ! -name '*arm*' | sort | head -n 1)
          arm64=$(find build/app/outputs/flutter-apk build/app/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*release.apk' | sort | head -n 1)
          armv7=$(find build/app/outputs/flutter-apk build/app/outputs/apk/release -maxdepth 1 -type f -name '*armeabi-v7a*release.apk' | sort | head -n 1)
          test -n "$universal"
          test -s "$universal"
          test -n "$arm64"
          test -s "$arm64"
          test -n "$armv7"
          test -s "$armv7"
          cp "$universal" release-assets/CLICK-TV-LAUNCHER-universal-release.apk
          cp "$arm64" release-assets/CLICK-TV-LAUNCHER-arm64-v8a-release.apk
          cp "$armv7" release-assets/CLICK-TV-LAUNCHER-armeabi-v7a-release.apk
          ls -l release-assets
          sha256sum release-assets/*.apk

      - name: Generate Release Notes
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: python3 .github/scripts/generate_release_notes.py

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: release_notes.md
          files: release-assets/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag_name || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar APK adjuntos en la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          count=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length')
          echo "APK adjuntos: $count"
          test "$count" -eq 3
