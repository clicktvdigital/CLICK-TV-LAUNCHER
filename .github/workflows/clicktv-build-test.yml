name: CLICK TV LAUNCHER - Prueba APK

on:
  workflow_dispatch:
  push:
    branches:
      - clicktv-mejoras
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Preparar dependencias
        run: |
          flutter --version
          flutter pub get

      - name: Generar codigo
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Generar esquemas Drift
        run: |
          dart run drift_dev schema generate drift_schemas/ test/generated_migrations/

      - name: Verificar identificador Android
        run: |
          grep -q "applicationId \"com.clicktv.launcher\"" android/app/build.gradle

      - name: Compilar APK de prueba
        run: |
          flutter build apk --debug --target-platform=android-arm,android-arm64

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLICK-TV-LAUNCHER-APK-PRUEBA
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
