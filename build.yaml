targets:
  $default:
    builders:
      drift_dev:
        enabled: false
      drift_dev|not_shared:
        enabled: true
      mockito|mockBuilder:
        enabled: true
        generate_for:
          - test/mocks.dart
      build_resolvers|transitive_digests:
        enabled: false

  run_built_value:
    dependencies: [ 'flauncher' ]
    builders:
      drift_dev:
        enabled: false
      drift_dev|preparing_builder:
        enabled: false
